name: Sync listings

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_listings.py
      - .github/workflows/sync-listings.yml

concurrency:
  group: sync-listings
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Royal LePage listings
        env:
          PYTHONUTF8: "1"
        run: python scripts/sync_listings.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/listings.json assets/images/listings inscriptions index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No listing changes"
          else
            git commit -m "Sync inscriptions Royal LePage"
            git push
          fi
